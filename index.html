<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MaruComprehension</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #1a1c1d; color: #d8dcea;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
}
.card {
  background: #2D3031; border: 1px solid #363A3B; border-radius: 14px;
  padding: 40px 48px; max-width: 520px; text-align: center;
}
h1 { font-size: 24px; font-weight: 800; color: #f2f4fa; margin-bottom: 6px; }
.version { font-size: 13px; color: #66AAE8; font-weight: 700; margin-bottom: 20px; }
p { font-size: 14px; color: #a8b2cc; line-height: 1.6; margin-bottom: 16px; }
.links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.btn {
  padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 700;
  text-decoration: none; transition: filter .15s; color: #fff;
}
.btn:hover { filter: brightness(.9); }
.btn-blue { background: #66AAE8; }
.btn-green { background: #72CE9D; }
.btn-purple { background: #7E69F0; }
</style>
</head>
<body>
<div class="card">
  <h1>MaruComprehension</h1>
  <p class="version">v1.5 — Chrome Extension</p>
  <p>Unofficial MaruMori companion for comprehensible-input video platforms.<br>
  Japanese subtitle coloring, word lookup, immersion tracking, and SRS integration.</p>
  <div class="links">
    <a class="btn btn-blue" href="https://github.com/MDecru/MaruComprehensible">GitHub</a>
    <a class="btn btn-purple" href="https://chromewebstore.google.com">Chrome Web Store</a>
  </div>
</div>
</body>
</html>
